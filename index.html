<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mjödbryggning Pro</title>
    
    <!-- 1. Hämta designmotorn (Tailwind CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Hämta React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Hämta Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        Babel.registerPreset("classic-react", {
            presets: [
                [Babel.availablePresets["react"], { runtime: "classic" }]
            ]
        });
    </script>

    <!-- 4. Hämta Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #0f172a; color: #ffedd5; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(251, 146, 60, 0.2); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(251, 146, 60, 0.4); }
        .saving-pulse { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        
        @media print {
            body { background-color: white !important; color: black !important; margin: 0 !important; padding: 0 !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            @page { margin: 0; size: A4; }
            .label-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 5mm;
                padding: 10mm;
                margin: 0;
            }
            .bottle-label {
                width: 90mm;
                height: 60mm;
                border: 1px dashed #ccc;
                padding: 5mm;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                position: relative;
                overflow: hidden;
                page-break-inside: avoid;
            }
        }
        .print-only { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="classic-react">
        const { useState, useEffect, useRef } = React;

        // --- IKONER ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Wrench: <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />,
                Archive: <><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></>,
                Plus: <path d="M5 12h14M12 5v14"/>,
                Save: <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8"/>,
                Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>,
                Trash2: <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/>,
                Calendar: <><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></>,
                Info: <><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>,
                X: <><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>,
                TrendingDown: <><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></>,
                Bell: <><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></>,
                ChevronDown: <path d="m6 9 6 6 6-6"/>,
                FolderOpen: <path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/>,
                LogIn: <><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></>,
                LogOut: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></>,
                User: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
                Download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>,
                Upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>,
                Scale: <><path d="m16 16 3-8 3 8c-.87.62-1.9.87-3 .87s-2.13-.25-3-.87Z"/><path d="m2 16 3-8 3 8c-.87.62-1.9.87-3 .87s-2.13-.25-3-.87Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h18"/></>,
                Printer: <><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></>,
                Bottle: <><path d="M9 3h6v3a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2V3z"/><path d="M9 6h6"/><path d="M12 3v3"/></>,
                Shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
                Droplet: <path d="m12 22 4.5-4.5c.9-.9 1.5-2.1 1.5-3.5A6 6 0 1 0 6 14c0 1.4.6 2.6 1.5 3.5L12 22z"/>,
                AlertTriangle: <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3ZM12 9v4m0 4h.01"/>,
                Sparkles: <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>,
                Send: <><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        // --- FIREBASE SETUP ---
        const firebaseConfig = {
            apiKey: "AIzaSyDGmN-60JoFMFyKNtEVR4sRf258GTv2jU4",
            authDomain: "mjodbryggning.firebaseapp.com",
            projectId: "mjodbryggning",
            storageBucket: "mjodbryggning.firebasestorage.app",
            messagingSenderId: "795065616004",
            appId: "1:795065616004:web:27f329729112c0f09fa4d1",
            measurementId: "G-1GDMF1NNQ4"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "mjodbryggning-live"; 

        function App() {
            // --- STATES ---
            const [user, setUser] = useState(null);
            const [isOffline, setIsOffline] = useState(false);
            
            // --- AI CHAT STATES ---
            const [geminiApiKey, setGeminiApiKey] = useState('');
            const [chatMessages, setChatMessages] = useState([
                { role: 'assistant', text: 'Hej! Jag är din personliga mjödbryggar-AI. Jag har koll på din aktiva batch och kan hjälpa dig med frågor om jäsning, recept eller felsökning. Hur kan jag hjälpa dig idag?' }
            ]);
            const [chatInput, setChatInput] = useState('');
            const [isChatLoading, setIsChatLoading] = useState(false);
            const [showChatPanel, setShowChatPanel] = useState(false);
            const [showChatSettings, setShowChatSettings] = useState(false);
            const [apiKeyInput, setApiKeyInput] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [currentBatchId, setCurrentBatchId] = useState(null);
            const [showInfo, setShowInfo] = useState(false);
            const [showBatchMenu, setShowBatchMenu] = useState(false);
            const [showDeleteModal, setShowDeleteModal] = useState(false);
            const [showNewBatchConfirm, setShowNewBatchConfirm] = useState(false); 
            const [batchToDelete, setBatchToDelete] = useState(null);
            const [showReminderMenu, setShowReminderMenu] = useState(false);
            const [showSweetenMenu, setShowSweetenMenu] = useState(false);
            const [showStabilizerMenu, setShowStabilizerMenu] = useState(false);
            const [showBentoniteMenu, setShowBentoniteMenu] = useState(false);
            const [sweetenVolume, setSweetenVolume] = useState(4.5);
            const [sweetenTargetFg, setSweetenTargetFg] = useState(20);
            const [stabilizerVolume, setStabilizerVolume] = useState(5);
            const [bentoniteVolume, setBentoniteVolume] = useState(5);
            const [reminderType, setReminderType] = useState('measure');
            const [nameError, setNameError] = useState(false);
            
            const [batchName, setBatchName] = useState('');
            const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [honeyType, setHoneyType] = useState('');
            const [honeyAmount, setHoneyAmount] = useState('');
            const [waterAmount, setWaterAmount] = useState('');
            const [yeastType, setYeastType] = useState('');
            const [ingredients, setIngredients] = useState('');
            const [log, setLog] = useState('');
            const [og, setOg] = useState(0);
            const [ogTemp, setOgTemp] = useState(20);
            const [fg, setFg] = useState(0);
            const [fgTemp, setFgTemp] = useState(20);
            const [savedBatches, setSavedBatches] = useState([]);

            const fileInputRef = useRef(null);
            const batchMenuRef = useRef(null);
            const chatEndRef = useRef(null);

            // --- HJÄLPFUNKTIONER ---
            const getCorrectedGravity = (g, t) => {
                const grav = parseFloat(g);
                const temp = parseFloat(t);
                if (isNaN(grav) || isNaN(temp)) return 0;
                return grav + ((temp - 20) * 0.2);
            };

            const calculatePotentialABV = () => Math.max(0, getCorrectedGravity(og, ogTemp) / 7.5).toFixed(1);
            const calculateCurrentABV = () => {
                const cOG = getCorrectedGravity(og, ogTemp);
                const cFG = getCorrectedGravity(fg, fgTemp);
                if (cOG <= 0) return "0.0";
                return Math.max(0, (cOG - cFG) / 7.5).toFixed(1);
            };
            const calculateAttenuation = () => {
                const cOG = getCorrectedGravity(og, ogTemp);
                const cFG = getCorrectedGravity(fg, fgTemp);
                if (cOG <= 0) return "0.0";
                return Math.max(0, Math.min(100, ((cOG - cFG) / cOG) * 100)).toFixed(1);
            };
            const getSweetnessStatus = () => {
                const cFG = getCorrectedGravity(fg, fgTemp);
                if (og == 0 && fg == 0) return "-";
                if (cFG >= 45) return "Dessert / Mycket sött";
                if (cFG >= 25) return "Sött";
                if (cFG >= 12) return "Halvsött";
                if (cFG >= 4) return "Halvtorrt";
                return "Torrt";
            };
            const getDaysSince = (d) => {
                if (!d) return 0;
                const start = new Date(d); const today = new Date();
                start.setHours(0,0,0,0); today.setHours(0,0,0,0);
                return Math.max(0, Math.floor((today - start) / (1000 * 60 * 60 * 24)));
            };

            const calculateHoneyForSweetening = () => {
                const diff = Math.max(0, parseFloat(sweetenTargetFg) - getCorrectedGravity(fg, fgTemp));
                return Math.round(diff * parseFloat(sweetenVolume) * 2.7);
            };

            const calculateStabilizerAmount = () => (parseFloat(stabilizerVolume) * 0.1).toFixed(1);
            const calculateBentoniteAmount = () => (parseFloat(bentoniteVolume) * 1).toFixed(1);

            const getBatchVolume = () => {
                const h = parseFloat(honeyAmount) || 0;
                const w = parseFloat(waterAmount) || 0;
                // Honung densitet ca 1.4kg/L. Volym = (h/1000)/1.4 + w/1000
                const vol = ((h / 1000) / 1.4) + (w / 1000);
                return vol > 0 ? parseFloat(vol.toFixed(1)) : 0;
            };

            const handleLogSweetening = () => {
                const amount = calculateHoneyForSweetening();
                const today = new Date().toISOString().split('T')[0].replace(/-/g, '/');
                setLog(prev => prev + (prev.length > 0 && !prev.endsWith('\n') ? '\n' : '') + `- ${today}: Tillsatt ${amount}g honung för eftersötning (Mål: ${sweetenTargetFg} °Oe)\n`);
                setShowSweetenMenu(false);
            };

            const handleLogStabilizer = () => {
                const amount = calculateStabilizerAmount();
                const today = new Date().toISOString().split('T')[0].replace(/-/g, '/');
                setLog(prev => prev + (prev.length > 0 && !prev.endsWith('\n') ? '\n' : '') + `- ${today}: Stabiliserat med ${amount}g vinsvavla (${stabilizerVolume}L)\n`);
                setShowStabilizerMenu(false);
            };

            const handleLogBentonite = () => {
                const amount = calculateBentoniteAmount();
                const today = new Date().toISOString().split('T')[0].replace(/-/g, '/');
                setLog(prev => prev + (prev.length > 0 && !prev.endsWith('\n') ? '\n' : '') + `- ${today}: Klarning med ${amount}g bentonit (${bentoniteVolume}L)\n`);
                setShowBentoniteMenu(false);
            };

            // UPPDATERAD: Hämtar nu enbart data från loggen och startvärdet (OG)
            const getGraphData = () => {
                const dataPoints = [];
                const toYYMMDD = (dStr) => {
                    const d = new Date(dStr.replace(/\//g, '-'));
                    return d.toISOString().split('T')[0].substring(2).replace(/-/g, '');
                };
                
                if (og > 0 && startDate) {
                    dataPoints.push({
                        date: new Date(startDate).getTime(),
                        displayDate: toYYMMDD(startDate),
                        value: parseFloat(og),
                        type: 'start'
                    });
                }
                
                const regex = /- (\d{4}\/\d{2}\/\d{2}):\s*(-?\d+)\s*°Oe/g;
                let match;
                while ((match = regex.exec(log)) !== null) {
                    const dStr = match[1].replace(/\//g, '-');
                    const val = parseFloat(match[2]);
                    if (!isNaN(val)) {
                        dataPoints.push({
                            date: new Date(dStr).getTime(),
                            displayDate: toYYMMDD(match[1]),
                            value: val,
                            type: 'log'
                        });
                    }
                }
                dataPoints.sort((a, b) => a.date - b.date);
                return dataPoints;
            };

            const reminderOptions = {
                measure: { label: 'Mät Gravity', options: [{ label: '3 dagar', days: 3 }, { label: '1 vecka', days: 7 }, { label: '2 veckor', days: 14 }] },
                rack: { label: 'Tappa om', options: [{ label: '2 veckor', days: 14 }, { label: '4 veckor', days: 28 }, { label: '2 månader', days: 60 }] },
                feed: { label: 'Näring', options: [{ label: '24h (Dag 1)', days: 1 }, { label: '48h (Dag 2)', days: 2 }, { label: '72h (Dag 3)', days: 3 }, { label: '1 vecka', days: 7 }] },
                sweeten: { label: 'Eftersöta', options: [{ label: '3 dagar', days: 3 }, { label: '1 vecka', days: 7 }, { label: '2 veckor', days: 14 }] }
            };

            // --- EFFECTS ---
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    if (u) { setUser(u); setIsOffline(false); }
                    else {
                        auth.signInAnonymously().catch(() => {
                            setIsOffline(true);
                            const localData = localStorage.getItem('mjod_batches');
                            if (localData) setSavedBatches(JSON.parse(localData).sort((a, b) => b.id - a.id));
                        });
                    }
                });
                return () => unsubscribe();
            }, []);

            // Ladda API-nyckel från localStorage
            useEffect(() => {
                const localKey = localStorage.getItem('mjod_gemini_api_key');
                if (localKey) {
                    setGeminiApiKey(localKey);
                    setApiKeyInput(localKey);
                }
            }, []);

            // Scrolla till slutet av chatten när meddelanden, laddningsstatus eller panelvisning ändras
            useEffect(() => {
                if (chatEndRef.current) {
                    chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [chatMessages, isChatLoading, showChatPanel]);

            // Ladda API-nyckel från Firestore när användaren loggar in
            useEffect(() => {
                if (!user || isOffline || user.isAnonymous) return;
                const fetchProfile = async () => {
                    try {
                        const doc = await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).get();
                        if (doc.exists && doc.data().geminiApiKey) {
                            const dbKey = doc.data().geminiApiKey;
                            setGeminiApiKey(dbKey);
                            setApiKeyInput(dbKey);
                            localStorage.setItem('mjod_gemini_api_key', dbKey); // Backup synk lokalt
                        }
                    } catch (e) {
                        console.error("Kunde inte hämta profil:", e);
                    }
                };
                fetchProfile();
            }, [user, isOffline]);

            useEffect(() => {
                if (!user || isOffline) return;
                const unsubscribe = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('batches')
                    .onSnapshot((snapshot) => {
                        const batches = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setSavedBatches(batches.sort((a, b) => (b.id > a.id ? 1 : -1)));
                        
                        // Kolla om vi ska ladda en specifik batch från URL
                        const urlParams = new URLSearchParams(window.location.search);
                        const batchIdFromUrl = urlParams.get('batch');
                        if (batchIdFromUrl && !currentBatchId) {
                            const target = batches.find(b => b.id === batchIdFromUrl);
                            if (target) handleLoadBatch(target);
                        }
                    }, () => setIsOffline(true));
                return () => unsubscribe();
            }, [user, isOffline]);

            useEffect(() => {
                function handleClickOutside(event) {
                    if (batchMenuRef.current && !batchMenuRef.current.contains(event.target)) {
                        setShowBatchMenu(false);
                    }
                }
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, [batchMenuRef]);

            // --- ACTIONS ---
            const handleGoogleLogin = async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                try { await auth.signInWithPopup(provider); } catch (e) { alert("Inloggning misslyckades: " + e.code); }
            };

            const handleLogout = async () => { await auth.signOut(); auth.signInAnonymously().catch(() => setIsOffline(true)); };

            const handleAddLogEntry = () => {
                const today = new Date().toISOString().split('T')[0].replace(/-/g, '/');
                setLog(prev => prev + (prev.length > 0 && !prev.endsWith('\n') ? '\n' : '') + `- ${today}: ${fg} °Oe, ${calculateCurrentABV()}% ABV (${calculateAttenuation()}% utjäst)\n`);
            };

            const handleAddDateOnly = () => {
                const today = new Date().toISOString().split('T')[0].replace(/-/g, '/');
                setLog(prev => prev + (prev.length > 0 && !prev.endsWith('\n') ? '\n' : '') + `- ${today}: `);
            };

            const handleAddBottling = () => {
                const today = new Date().toISOString().split('T')[0].replace(/-/g, '/');
                setLog(prev => prev + (prev.length > 0 && !prev.endsWith('\n') ? '\n' : '') + `- ${today}: Buteljerad\n`);
            };

            const handleAddStartLog = () => {
                const datePart = startDate.replace(/-/g, '/');
                setLog(prev => prev + (prev.length > 0 && !prev.endsWith('\n') ? '\n' : '') + `- ${datePart}: STARTAD (OG: ${og} °Oe)\n`);
            };

            const getBottlingDate = () => {
                const regex = /- (\d{4}\/\d{2}\/\d{2}): Buteljerad/g;
                let lastMatch = null;
                let match;
                while ((match = regex.exec(log)) !== null) {
                    lastMatch = match[1];
                }
                return lastMatch || new Date().toISOString().split('T')[0].replace(/-/g, '/');
            };

            const handleSaveBatch = async () => {
                if (!batchName.trim()) return setNameError(true);
                if (isSaving) return;
                setIsSaving(true);
                const data = { name: batchName, startDate, lastModified: new Date().toLocaleDateString('sv-SE'), ingredients, log, og, ogTemp, fg, fgTemp, honeyType, honeyAmount, waterAmount, yeastType };
                try {
                    let finalId = currentBatchId || Date.now().toString();
                    if (!currentBatchId) setCurrentBatchId(finalId);
                    if (isOffline || !user) {
                        const existing = savedBatches.find(b => b.id === finalId);
                        let newBatches = existing ? savedBatches.map(b => b.id === finalId ? { ...data, id: finalId } : b) : [...savedBatches, { ...data, id: finalId }];
                        setSavedBatches(newBatches.sort((a, b) => (b.id > a.id ? 1 : -1)));
                        localStorage.setItem('mjod_batches', JSON.stringify(newBatches));
                    } else {
                        await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('batches').doc(finalId).set(data, { merge: true });
                    }
                } catch (e) { alert("Fel vid sparning."); } finally { setIsSaving(false); }
            };

            const handleLoadBatch = (b) => {
                setCurrentBatchId(b.id); setBatchName(b.name); setStartDate(b.startDate || new Date().toISOString().split('T')[0]);
                setHoneyType(b.honeyType || ''); setHoneyAmount(b.honeyAmount || '');
                setWaterAmount(b.waterAmount || '');
                setYeastType(b.yeastType || '');
                setIngredients(b.ingredients || ''); setLog(b.log || ''); setOg(b.og || 0); setOgTemp(b.ogTemp || 20);
                setFg(b.fg || 0); setFgTemp(b.fgTemp || 20); setNameError(false); setShowBatchMenu(false);
            };

            const handleExportData = () => {
                if(savedBatches.length === 0) return alert("Inget att exportera");
                const blob = new Blob([JSON.stringify(savedBatches, null, 2)], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `mjod-backup.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if(Array.isArray(data)) {
                            const currentIds = new Set(savedBatches.map(b => b.id));
                            for(const b of data) {
                                if(!currentIds.has(b.id)) {
                                    const newId = b.id || (Date.now() + Math.floor(Math.random()*1000)).toString();
                                    const {id, ...rest} = b;
                                    if (isOffline) { setSavedBatches(prev => [...prev, {...rest, id: newId}].sort((a,b) => (b.id > a.id ? 1 : -1))); }
                                    else { await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('batches').doc(newId).set(rest); }
                                }
                            }
                            alert("Import klar!");
                        }
                    } catch(err) { alert("Fel vid import"); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const handleNewBatchClick = () => setShowNewBatchConfirm(true);
            const proceedToNewBatch = () => {
                setCurrentBatchId(null); setBatchName(''); setStartDate(new Date().toISOString().split('T')[0]);
                setHoneyType(''); setHoneyAmount(''); setWaterAmount(''); setYeastType('');
                setIngredients(''); setLog(''); setOg(0); setOgTemp(20); setFg(0); setFgTemp(20);
                setNameError(false); setShowNewBatchConfirm(false); setShowBatchMenu(false);

                localStorage.setItem('mjod_gemini_api_key', trimmedKey);
                
                if (user && !isOffline && !user.isAnonymous) {
                    try {
                        await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).set({
                            geminiApiKey: trimmedKey
                        }, { merge: true });
                    } catch (e) {
                        console.error("Kunde inte spara API-nyckel i Firestore:", e);
                    }
                }
                setShowChatSettings(false);
            };

            const handleClearApiKey = async () => {

                setApiKeyInput('');
                localStorage.removeItem('mjod_gemini_api_key');
                if (user && !isOffline && !user.isAnonymous) {
                    try {
                        await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).set({
                            geminiApiKey: firebase.firestore.FieldValue.delete()

                        console.error("Kunde inte ta bort API-nyckel från Firestore:", e);

            const handleSendChatMessage = async (customText = null) => {

                if (!textToSend.trim() || isChatLoading) return;
                
                if (!geminiApiKey) {
                    setShowChatSettings(true);
                    setShowChatPanel(true);
                    return;
                }
                
                const newMessages = [...chatMessages, { role: 'user', text: textToSend }];
                setChatMessages(newMessages);
                setChatInput('');
                setIsChatLoading(true);
                
                try {
                    const activeBatchText = `
- Namn: ${batchName || 'Namnlös'}
- Startdatum: ${startDate} (${getDaysSince(startDate)} dagar sedan)
- Honungssort: ${honeyType || 'Ej angivet'}
- Honung: ${honeyAmount ? honeyAmount + 'g' : 'Ej angivet'}
- Vatten: ${waterAmount ? waterAmount + 'ml' : 'Ej angivet'}
- Jäst: ${yeastType || 'Ej angivet'}
- Övriga ingredienser: ${ingredients || 'Inga'}
- OG (Original Gravity): ${og} °Oe (Temp: ${ogTemp}°C)
- FG (Final/Aktuell Gravity): ${fg} °Oe (Temp: ${fgTemp}°C)
- Alkoholhalt (ABV): ${calculateCurrentABV()}%
- Utjäsning: ${calculateAttenuation()}%
- Sötma: ${getSweetnessStatus()}
- Loggbok / Anteckningar:
${log || 'Inga anteckningar ännu.'}
`;

                    const systemInstruction = `Du är en expert på mjödbryggning och hembryggning (Mjödbryggning Pro AI).
Du hjälper användaren med frågor om hembryggning och dess processer. Svara alltid professionellt, uppmuntrande och pedagogiskt på svenska.
När du svarar på frågor, ta hänsyn till all tillgänglig information om användarens aktuella brygd (som anges nedan).
Om det finns problem (t.ex. långsam jäsning, konstig doft, mögelrädsla), ge konkreta felsökningssteg och förklara biologin/kemin bakom på ett enkelt sätt.

Här är data om användarens aktuella brygd:
${activeBatchText}

Svara tydligt och pedagogiskt. Använd gärna punktlistor för tydlighet. Använd INTE komplex markdown utöver fetstil eller punktlistor.`;

                    const historyForGemini = newMessages.slice(-10).map((msg) => {
                        return {
                            role: msg.role === 'user' ? 'user' : 'model',
                            parts: [{ text: msg.text }]
                        };

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            system_instruction: {
                                parts: [{ text: systemInstruction }]
                            },
                            contents: historyForGemini,
                            generationConfig: {
                                maxOutputTokens: 4096,
                                temperature: 0.7
                            }
                        })
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error?.message || `HTTP fel ${response.status}`);
                    }

                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Hittade inget svar. Försök igen.";
                    setChatMessages(prev => [...prev, { role: 'assistant', text: aiText }]);

                    console.error("AI Fel:", e);
                    setChatMessages(prev => [...prev, { role: 'assistant', text: `Hoppsan, något gick fel vid anropet till AI:n: ${e.message}. Kontrollera din internetanslutning och API-nyckel.` }]);
                } finally {
                    setIsChatLoading(false);
                }
            };

            const handleFillTestData = async () => {
                const s1 = new Date(); s1.setDate(s1.getDate()-60);
                const s2 = new Date(); s2.setDate(s2.getDate()-25);
                const getP = (start, days, val) => {
                    const d = new Date(start); d.setDate(d.getDate() + days);
                    const att = Math.max(0, Math.min(100, ((115 - val) / 115) * 100)).toFixed(1);
                    const abv = Math.max(0, (115 - val) / 7.5).toFixed(1);
                    return `- ${d.toISOString().split('T')[0].replace(/-/g,'/')}: ${val} °Oe, ${abv}% ABV (${att}% utjäst)\n`;
                };
                let log1 = ""; const pts1 = [{d:0,v:115}, {d:5,v:108}, {d:12,v:75}, {d:20,v:35}, {d:30,v:12}, {d:45,v:2}, {d:60,v:2}]; pts1.forEach(p => log1 += getP(s1, p.d, p.v));
                let log2 = ""; const pts2 = [{d:0,v:95}, {d:7,v:78}, {d:14,v:42}, {d:22,v:18}, {d:25,v:14}]; pts2.forEach(p => log2 += getP(s2, p.d, p.v));
                const b1 = { name: "Viking Blod (Test)", startDate: s1.toISOString().split('T')[0], ingredients: "4kg Ljung-honung\n12l Vatten\n60g Hibiskus", log: log1, og: 115, fg: 2 };

                                            <li><span className="text-orange-100 font-medium">Logg & Graf:</span> Skriv ner dina mätningar i loggen med formatet <code className="bg-slate-950 px-1 rounded text-orange-400">ÅÅÅÅ/MM/DD: 10 °Oe</code> så ritas grafen automatiskt.</li>

                                        <p className="mb-2">Öchslevikten talar om hur mycket socker som finns i vätskan. </p>
                                        <ul className="list-disc pl-5 space-y-2">
                                            <li><span className="text-orange-100 font-medium">OG (Original Gravity):</span> Värdet innan jäsning. Avgör hur starkt mjödet kan bli.</li>
                                            <li><span className="text-orange-100 font-medium">FG (Final Gravity):</span> Värdet när det slutat jäsa. Avgör hur sött det färdiga mjödet är.</li>
                                            <li><span className="text-orange-100 font-medium">Temperatur:</span> Mätaren är kalibrerad för 20°C. Om vätskan är varmare eller kallare korrigerar appen detta automatiskt (+/- 0.2 per grad).</li>
                                        </ul>

                                            <div className="bg-slate-900 p-2 rounded border border-slate-700"><strong>Halvtorrt:</strong> 4 - 12 °Oe</div>

                                        </div>

                                <h3 className="text-lg font-bold text-orange-400 mb-2 flex gap-2"><Icon name="AlertTriangle"/> Ny batch?</h3>

                                    <Icon name="Save" size={16} className={isSaving ? "saving-pulse" : ""}/> <span className="text-xs font-medium hidden sm:inline">{isSaving ? 'Sparar...' : 'Spara'}</span>

                                            <div className="flex justify-between items-center mb-1">

                                                <input type="text" value={honeyType} onChange={e => setHoneyType(e.target.value)} placeholder="" className="w-full bg-transparent border-none text-sm text-orange-100 focus:outline-none"/>

                                        <div className="bg-slate-950/60 p-3 rounded-lg border border-slate-800 space-y-2">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Gemini API-nyckel</label>
                                            <input type="password" value={apiKeyInput} onChange={e => setApiKeyInput(e.target.value)} placeholder="AIzaSy..." className="w-full bg-slate-900 border border-slate-700/60 rounded px-2.5 py-1.5 text-xs text-orange-100 focus:outline-none focus:border-orange-500/50 font-mono"/>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 border-t border-slate-800/80 pt-3">
                                        <button onClick={handleClearApiKey} className="flex-1 py-2 text-xs font-bold border border-red-900/50 hover:bg-red-950/30 text-red-400 rounded-lg transition-colors">Rensa nyckel</button>
                                        <button onClick={() => handleSaveApiKey(apiKeyInput)} className="flex-1 py-2 text-xs font-bold bg-orange-500 hover:bg-orange-400 text-slate-950 rounded-lg transition-colors">Spara nyckel</button>
                                    </div>
                                </div>
                            ) : (
                                /* Chat View */
                                <div className="flex-1 flex flex-col min-h-0">
                                    {/* Messages list */}
                                    <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3">
                                        {chatMessages.map((msg, i) => (
                                            <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[85%] rounded-2xl px-3.5 py-2.5 text-xs leading-relaxed shadow-md break-words whitespace-pre-wrap ${msg.role === 'user' ? 'bg-orange-500 text-slate-950 font-medium rounded-tr-none' : 'bg-slate-800/80 border border-slate-750 text-slate-200 rounded-tl-none'}`} style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
                                                    {msg.text}
                                                </div>
                                            </div>
                                        ))}
                                        {isChatLoading && (
                                            <div className="flex justify-start">
                                                <div className="bg-slate-800/80 border border-slate-750 rounded-2xl rounded-tl-none px-4 py-3 flex items-center gap-1.5">
                                                    <span className="w-1.5 h-1.5 bg-orange-400 rounded-full animate-bounce" style={{animationDelay: '0ms'}}></span>
                                                    <span className="w-1.5 h-1.5 bg-orange-400 rounded-full animate-bounce" style={{animationDelay: '150ms'}}></span>
                                                    <span className="w-1.5 h-1.5 bg-orange-400 rounded-full animate-bounce" style={{animationDelay: '300ms'}}></span>
                                                </div>
                                            </div>
                                        )}
                                        <div ref={chatEndRef} />
                                    </div>

                                    {/* Suggested questions */}
                                    {chatMessages.length === 1 && (
                                        <div className="px-4 pb-2 pt-1 flex flex-wrap gap-1.5 border-t border-slate-800/30">
                                            <button onClick={() => handleSendChatMessage('Är det normalt att min jäsning går så här långsamt?')} className="bg-slate-950/40 hover:bg-slate-800 text-[10px] text-amber-400 border border-slate-800 rounded-full px-3 py-1.5 transition-colors">Långsam jäsning?</button>
                                            <button onClick={() => handleSendChatMessage('När är det dags att tappa om mitt mjöd?')} className="bg-slate-950/40 hover:bg-slate-800 text-[10px] text-amber-400 border border-slate-800 rounded-full px-3 py-1.5 transition-colors">Tappa om?</button>
                                            <button onClick={() => handleSendChatMessage('Hur ökar jag alkoholhalten eller eftersötar säkert?')} className="bg-slate-950/40 hover:bg-slate-800 text-[10px] text-amber-400 border border-slate-800 rounded-full px-3 py-1.5 transition-colors">Sötning & Alkohol</button>
                                        </div>
                                    )}

                                    {/* Chat Input */}
                                    <div className="p-3 bg-slate-950/50 border-t border-slate-850 flex gap-2">
                                        <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSendChatMessage()} placeholder={geminiApiKey ? "Fråga AI:n..." : "Klicka på inställningar för att lägga till nyckel..."} disabled={!geminiApiKey || isChatLoading} className="flex-1 bg-slate-900 border border-slate-700/60 rounded-xl px-3 py-2 text-xs text-orange-100 focus:outline-none focus:border-orange-500/50 placeholder-slate-500 disabled:opacity-50 disabled:cursor-not-allowed"/>
                                        <button onClick={() => handleSendChatMessage()} disabled={!geminiApiKey || isChatLoading || !chatInput.trim()} className="bg-orange-500 hover:bg-orange-400 disabled:bg-slate-800 text-slate-950 disabled:text-slate-600 p-2 rounded-xl active:scale-95 transition-all duration-150 flex items-center justify-center disabled:scale-100 disabled:cursor-not-allowed">
                                            <Icon name="Send" size={16}/>
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* UTSKRIFTSVY (Etiketter) */}
                    <div className="print-only">
                        <div className="label-grid">
                            {Array.from({ length: 8 }).map((_, i) => (
                                <div key={i} className="bottle-label">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h1 className="text-lg font-bold leading-tight">{batchName || "Namnlös Brygd"}</h1>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-sm font-bold text-orange-600">{currentABV}%</div>
                                        </div>
                                    </div>
                                    
                                    <div className="flex-1 my-2 border-y border-gray-100 py-2 overflow-hidden">
                                        <p className="text-[8px] text-gray-500 uppercase mb-1 font-bold">Ingredienser</p>
                                        <p className="text-[9px] leading-tight text-gray-700 italic">
                                            {[
                                                honeyType ? `${honeyAmount}g ${honeyType}` : null,
                                                yeastType || null,
                                                ingredients ? ingredients.split('\n').filter(line => line.trim()).join(', ') : null
                                            ].filter(Boolean).join(', ')}
                                            {!honeyType && !yeastType && !ingredients && "Honung, vatten, jäst"}
                                        </p>
                                    </div>

                                    <div className="flex justify-between items-end">
                                        <div className="space-y-0.5">
                                            <p className="text-[8px] text-gray-400">Batch #{currentBatchId?.slice(-4) || "0000"}</p>
                                            <p className="text-[8px] text-gray-400">Startad: {startDate.replace(/-/g, '/')}</p>
                                            <p className="text-[8px] text-gray-400">Buteljerad: {getBottlingDate()}</p>
                                        </div>
                                        <div className="w-12 h-12 bg-gray-50 flex items-center justify-center border border-gray-100">
                                            <img src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent('https://johannespaulsson.github.io/honungsdryck/')}`} className="w-10 h-10 opacity-80" />
                                        </div>
                                    </div>
                                    
                                    {/* Bee Icon Placeholder */}
                                    <div className="absolute -top-2 -right-2 opacity-5 scale-150 rotate-12 pointer-events-none">
                                        <Icon name="Archive" size={80}/>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
